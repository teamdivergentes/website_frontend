# PID file in a location accessible to non-root user
pid /run/nginx.pid;

# Load headers_more module if available
# load_module modules/ngx_http_headers_more_filter_module.so; # Module non disponible

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Security optimizations
    server_tokens off;
    # more_clear_headers Server; # Module headers_more non disponible
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/m;

    # Proxy cache for uploads (images)
    proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m max_size=500m inactive=30d use_temp_path=off;

    # EPIC-29 — microcache du HTML rendu par le serveur SSR.
    # Sans lui, chaque passage de crawler declenche un rendu Angular complet plus
    # les appels backend associes : une rafale de bots sociaux sur un article
    # partage couterait autant de rendus que de bots. 60 s suffisent a absorber
    # une rafale sans retarder la publication d'un article au-dela d'une minute.
    proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=200m inactive=10m use_temp_path=off;

    # Le HTML rendu depend de la session : une page servie a un visiteur
    # authentifie ne doit jamais etre resservie a un anonyme. On ne met donc en
    # cache que les requetes sans cookie de session.
    # La regex est entre guillemets : un `;` non quote terminerait la directive
    # et Nginx refuserait de demarrer sur « invalid number of map parameters ».
    map $http_cookie $ssr_cache_bypass {
        default                       0;
        "~*(^|;\s*)dvg_auth_token="   1;
    }

    # Force SVG downloads to prevent XSS
    map $uri $svg_content_disposition {
        ~*\.svg$  "attachment";
        default   "";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.csr.html;

        # Security headers for all responses
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CSP — variable pour lisibilité, header émis sur une seule ligne (requis HTTP)
        set $csp_default  "default-src 'self'";
        set $csp_script   "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://matomo.tellebma.fr";
        set $csp_style    "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
        set $csp_img      "img-src 'self' data: blob: https:";
        set $csp_font     "font-src 'self' data: https://fonts.gstatic.com";
        set $csp_connect  "connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://api.twitch.tv wss://pubsub-edge.twitch.tv wss://irc-ws.chat.twitch.tv https://matomo.tellebma.fr";
        # matomo.tellebma.fr est requis pour l'iframe d'opt-out Matomo de /privacy-optout
        set $csp_frame    "frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv https://player.vimeo.com https://www.dailymotion.com https://open.spotify.com https://platform.twitter.com https://matomo.tellebma.fr";
        set $csp_ancestor "frame-ancestors 'self'";
        add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
        # SEO: X-Robots-Tag (placeholder replaced by entrypoint.sh based on ROBOTS_ALLOW env var)
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;


        # P3: Rate limiting on auth endpoints (10 req/min)
        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # P2: Hide backend headers that Nginx already sets at server level
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # P3: Rate limiting on contact form (5 req/min)
        location = /api/contact {
            limit_req zone=forms burst=3 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # P3: Rate limiting on recruitment application (5 req/min)
        location ~ ^/api/recruitment/\d+/apply$ {
            limit_req zone=forms burst=3 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # Proxy all other API requests to backend (no rate limiting)
        # Note: no ^~ prefix to allow regex locations (recruitment apply) to take priority
        location /api/ {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            # P2: Hide backend Helmet headers (Nginx adds its own at server level)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # SEC-010: Deny access to source maps (.map files) — return 404 to avoid
        # revealing their existence. No add_header here (no pitfall with server-level headers).
        # This regex location takes priority over the static assets location below
        # because Nginx evaluates regex locations in order, first match wins.
        location ~* \.map$ {
            return 404;
        }

        # Cache static assets (excluding /api/ and /uploads/ which use ^~ prefix)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            try_files $uri =404;
        }

        # Dynamic sitemap.xml served by backend (cached 1h by Nginx)
        location = /sitemap.xml {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Cache sitemap responses (1h TTL)
            proxy_cache uploads_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 502 1m;
            proxy_cache_use_stale error timeout;
            proxy_cache_key "/sitemap.xml";

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # Shell SPA des routes en rendu client (/admin/**, /auth/**).
        #
        # Indispensable : le fallback `try_files ... /index.csr.html` declenche une
        # redirection interne, et Nginx re-resout alors la location. Sans ce bloc,
        # l'URI retombe dans `location /` — donc dans le SSR, qui rend une 404
        # Angular. Constate en recette : /admin/users renvoyait « Page non
        # trouvee » au lieu du panel.
        #
        # `internal` interdit d'y acceder directement depuis l'exterieur : le
        # shell brut, avec ses placeholders, n'a pas a etre servi sur une URL.
        location = /index.csr.html {
            internal;

            # Headers securite — repetes, add_header n'est pas heritant
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # Seules /admin/** et /auth/** aboutissent ici, et aucune ne doit
            # etre indexee.
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # Health check — EPIC-29.
        #
        # L'ancienne version renvoyait 200 des que Nginx tournait, y compris avec
        # un process Node mort : Traefik aurait continue a router du trafic vers
        # un conteneur incapable de rendre une seule page publique. La sonde
        # interroge donc Node, qui est le maillon reellement critique.
        location = /health {
            access_log off;
            proxy_pass http://127.0.0.1:4000/health/ssr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # SEO: 301 redirects pour anciennes URLs encore indexées par Google.
        # Sans ça, Google reçoit HTTP 200 sur ces paths (fallback SPA sur index.html)
        # et les traite comme soft 404. Chiffres = impressions GSC sur 90j.
        location = /team          { return 301 /structure/equipes; }  # 157 impressions
        location = /shop          { return 301 /boutique; }           # 138 impressions
        location = /stream        { return 301 /; }                   # 38 impressions
        location = /evenements    { return 301 /articles; }           # 37 impressions
        location = /graphic-chart { return 301 /; }                   # 20 impressions
        # /twitch est désormais une page active — plus de redirect SEO
        # location = /twitch        { return 301 /; }                   # 7 impressions
        location = /jeux          { return 301 /structure/equipes; }  # 4 impressions

        # SEO: bloquer l'indexation de /admin/ et /auth/ (Google avait indexé
        # /admin/login — 57 impressions). Robots.txt Disallow + en-tête X-Robots.
        #
        # SECURITY: add_header dans un bloc location écrase TOUS les add_header du
        # niveau server (comportement Nginx documenté). Les headers de sécurité
        # (CSP, HSTS, X-Frame-Options, etc.) doivent être répétés intégralement
        # dans chaque location qui possède son propre add_header.
        # Voir CLAUDE.md section "Known Pitfalls".
        location ^~ /admin/ {
            # Headers sécurité — répétés car add_header est non-héritant en location
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # SEO: interdire l'indexation des pages admin (X-Frame-Options DENY ici car
            # les pages admin ne doivent jamais être embarquées — plus strict que SAMEORIGIN)
            add_header X-Robots-Tag "noindex, nofollow" always;
            # index.csr.html et non index.html : en outputMode server, le build
            # Angular ne produit plus index.html. Ces routes restent en rendu
            # client, elles ne passent donc pas par Node.
            try_files $uri $uri/ /index.csr.html;
        }
        location ^~ /auth/ {
            # Headers sécurité — répétés car add_header est non-héritant en location
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # SEO: interdire l'indexation des pages auth (X-Frame-Options DENY — page login
            # ne doit jamais être embarquée, protection clickjacking renforcée)
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri $uri/ /index.csr.html;
        }

        # /profile est la troisieme route en rendu client. Sans ce bloc, elle
        # part vers Node, qui renvoie le shell CSR **du bundle serveur** — dont
        # les placeholders sont figes au build et qu'aucun entrypoint ne peut
        # substituer. Constate en recette : le titre d'onglet affichait
        # « __OG_TITLE__ ».
        location = /profile {
            # Headers securite — repetes, add_header n'est pas heritant
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri /index.csr.html;
        }

        # Proxy uploads to backend (static files served by NestJS)
        # ^~ prefix gives this location priority over regex locations
        location ^~ /uploads/ {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy cache configuration
            proxy_cache uploads_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 1;
            proxy_cache_key $uri;

            # Cache headers for clients
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Cache-Status $upstream_cache_status;

            # Security headers (must be repeated because add_header in location overrides server-level)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
            # Force SVG download to prevent XSS (empty string = header not added for non-SVG)
            add_header Content-Disposition $svg_content_disposition always;

        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
        
        # Deny access to sensitive files
        location ~* \.(env|log|ini|conf|bak|backup|old|orig|save|swp|tmp)$ {
            deny all;
        }
        
        # Deny access to version control directories
        location ~ /\.(git|svn|hg) {
            deny all;
        }
        
        # EPIC-29 — tout le HTML public est rendu par le serveur Node.
        #
        # DANGER : add_header dans un bloc location ecrase TOUS les add_header du
        # niveau server. Cette location porte le site public entier : un header
        # oublie ici, c'est la CSP retiree de tout le site, sans rien de visible
        # a l'oeil. La liste ci-dessous doit rester identique a celle du bloc
        # server. Voir CLAUDE.md, "Known Pitfalls".
        location / {
            # Le disque d'abord, le rendu serveur ensuite.
            #
            # Sans ce try_files, `location /` happe tout ce qui n'est pas une
            # extension d'asset connue. Constate en recette : /robots.txt et
            # /assets/config.json renvoyaient une page « Page non trouvee » rendue
            # par Angular. Un robots.txt casse, c'est le referencement du site
            # entier ; un config.json casse, c'est l'app cliente sans sa config
            # runtime. Aucun des deux ne se voit sur une page.
            try_files $uri @ssr;

            # Headers securite — repetes, add_header n'est pas heritant. Ils
            # s'appliquent aux fichiers servis depuis le disque par ce bloc.
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Robots-Tag "${ROBOTS_TAG}" always;
        }

        # Rendu serveur — cible du repli de `location /`.
        location @ssr {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Neutralise les `X-Forwarded-*` que Nginx ne pose pas lui-meme.
            #
            # `@angular/ssr` retombe en rendu client des qu'il recoit un
            # `x-forwarded-*` absent de sa liste de confiance. Avec
            # `trustProxyHeaders: true`, cette liste vaut exactement :
            # for, host, port, proto, prefix. `X-Forwarded-Server`, que Traefik
            # ajoute systematiquement, n'en fait pas partie.
            #
            # Le repli est silencieux : HTTP 200, un simple `console.warn`, et
            # la page part sans contenu ni meta. C'est ce qui a rendu la preprod
            # invisible aux crawlers du 2026-08-05 au 2026-08-08. Verifie sur le
            # VPS : la meme requete rend en 2,9 s avec la page complete sans cet
            # en-tete, et renvoie le shell en 5 ms avec.
            #
            # Les vider ici les supprime — Nginx ne transmet pas un en-tete dont
            # la valeur est vide. C'est la bonne frontiere : Nginx est le seul
            # point d'entree du conteneur, et il pose deja lui-meme les quatre
            # en-tetes qui comptent. Sans cela, n'importe quel client pourrait
            # aussi forcer le rendu client d'une page en ajoutant l'en-tete a sa
            # requete.
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Forwarded-Scheme "";

            # Le rendu d'une page appelle le backend : une page lente ne doit pas
            # pour autant laisser la connexion ouverte indefiniment.
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # Microcache : absorbe les rafales de crawlers sur un lien partage.
            proxy_cache ssr_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_valid 404 10s;
            # Une seule requete part vers Node pour une meme URL non encore en
            # cache ; les autres attendent son resultat.
            proxy_cache_lock on;
            # Mieux vaut resservir une page d'il y a une minute que propager une
            # erreur si Node redemarre.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $ssr_cache_bypass;
            proxy_no_cache $ssr_cache_bypass;
            add_header X-Cache-Status $upstream_cache_status always;

            # Headers securite — repetes integralement, cf. avertissement ci-dessus
            add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Robots-Tag "${ROBOTS_TAG}" always;

            # Node ne doit pas imposer ses propres en-tetes de securite : Nginx
            # est la seule autorite sur ce point.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
        }
    }

    # Metrics endpoint for nginx-prometheus-exporter (internal only)
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
            allow 172.16.0.0/12;
            deny all;
        }

        location / {
            return 404;
        }
    }
}
