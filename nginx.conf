# PID file in a location accessible to non-root user
pid /run/nginx.pid;

# Load headers_more module if available
# load_module modules/ngx_http_headers_more_filter_module.so; # Module non disponible

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Security optimizations
    server_tokens off;
    # more_clear_headers Server; # Module headers_more non disponible
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/m;

    # Proxy cache for uploads (images)
    proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m max_size=500m inactive=30d use_temp_path=off;

    # Force SVG downloads to prevent XSS
    map $uri $svg_content_disposition {
        ~*\.svg$  "attachment";
        default   "";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers for all responses
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CSP — variable pour lisibilité, header émis sur une seule ligne (requis HTTP)
        set $csp_default  "default-src 'self'";
        set $csp_script   "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com";
        set $csp_style    "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
        set $csp_img      "img-src 'self' data: blob: https:";
        set $csp_font     "font-src 'self' data: https://fonts.gstatic.com";
        set $csp_connect  "connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com";
        set $csp_frame    "frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv https://player.vimeo.com https://www.dailymotion.com https://open.spotify.com https://platform.twitter.com";
        set $csp_ancestor "frame-ancestors 'self'";
        add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_ancestor};" always;
        # SEO: X-Robots-Tag (placeholder replaced by entrypoint.sh based on ROBOTS_ALLOW env var)
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;


        # P3: Rate limiting on auth endpoints (10 req/min)
        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # P2: Hide backend headers that Nginx already sets at server level
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # P3: Rate limiting on contact form (5 req/min)
        location = /api/contact {
            limit_req zone=forms burst=3 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # P3: Rate limiting on recruitment application (5 req/min)
        location ~ ^/api/recruitment/\d+/apply$ {
            limit_req zone=forms burst=3 nodelay;
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # Proxy all other API requests to backend (no rate limiting)
        # Note: no ^~ prefix to allow regex locations (recruitment apply) to take priority
        location /api/ {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            # P2: Hide backend Helmet headers (Nginx adds its own at server level)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # Cache static assets (excluding /api/ and /uploads/ which use ^~ prefix)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            try_files $uri =404;
        }

        # Dynamic sitemap.xml served by backend (cached 1h by Nginx)
        location = /sitemap.xml {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Cache sitemap responses (1h TTL)
            proxy_cache uploads_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 502 1m;
            proxy_cache_use_stale error timeout;
            proxy_cache_key "/sitemap.xml";

            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Permitted-Cross-Domain-Policies;
            proxy_hide_header X-DNS-Prefetch-Control;
            proxy_hide_header X-Download-Options;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # Proxy uploads to backend (static files served by NestJS)
        # ^~ prefix gives this location priority over regex locations
        location ^~ /uploads/ {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy cache configuration
            proxy_cache uploads_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 1;
            proxy_cache_key $uri;

            # Cache headers for clients
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Cache-Status $upstream_cache_status;

            # Security headers (must be repeated because add_header in location overrides server-level)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
            # Force SVG download to prevent XSS (empty string = header not added for non-SVG)
            add_header Content-Disposition $svg_content_disposition always;

        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
        
        # Deny access to sensitive files
        location ~* \.(env|log|ini|conf|bak|backup|old|orig|save|swp|tmp)$ {
            deny all;
        }
        
        # Deny access to version control directories
        location ~ /\.(git|svn|hg) {
            deny all;
        }
        
        # Handle Angular routing (SPA) — no rate limiting on static pages
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Metrics endpoint for nginx-prometheus-exporter (internal only)
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
            allow 172.16.0.0/12;
            deny all;
        }

        location / {
            return 404;
        }
    }
}
