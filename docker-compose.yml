version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dvg-web-frontend:latest
    container_name: dvg-web-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
