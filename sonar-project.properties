# =====================================================================
# SonarQube - Team Divergentes Frontend
# Instance : https://sonarqube.tellebma.fr/
# =====================================================================

sonar.projectKey=dvg-frontend
sonar.projectName=Team Divergentes - Frontend

# Sources et tests
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.e2e.spec.ts

# Exclusions d'analyse
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/coverage/**, \
  **/*.spec.ts, \
  **/e2e/**, \
  **/playwright-report/**, \
  **/test-results/**, \
  **/.lighthouseci/**

# Exclusions de couverture (fichiers non testables ou de config)
sonar.coverage.exclusions=\
  src/main.ts, \
  src/environments/**, \
  src/**/*.module.ts, \
  src/**/*.routes.ts, \
  src/app/app.config.ts, \
  src/**/*.mock.ts, \
  src/**/*.stub.ts, \
  src/assets/**

# Rapport de couverture LCOV généré par Karma + karma-coverage
# Chemin : coverage/<nom-app>/lcov.info  (nom-app = "frontend" selon angular.json)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/frontend/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

# --- Temporaire : branche de comparaison A/B boutique (PR [DEPLOY], non mergeable) ---
# `shop-item` est restaure a l'identique depuis `develop` pour servir /boutique. Sonar le voit
# comme du code neuf et remonte S6819 (<dialog> natif plutot que role="dialog"), une dette qui
# existe deja en production. La corriger changerait le comportement de la modale — dont la
# visibilite est pilotee par [style.display] — et fausserait la comparaison visuelle.
# A supprimer avec la branche.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=src/shared/components/shop-item/shop-item.component.html
