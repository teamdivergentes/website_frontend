# =====================================================================
# SonarQube - Team Divergentes Frontend
# Instance : https://sonarqube.tellebma.fr/
# =====================================================================

sonar.projectKey=dvg-frontend
sonar.projectName=Team Divergentes - Frontend

# Sources et tests
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.e2e.spec.ts

# Exclusions d'analyse
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/coverage/**, \
  **/*.spec.ts, \
  **/e2e/**, \
  **/playwright-report/**, \
  **/test-results/**, \
  **/.lighthouseci/**

# Exclusions de couverture (fichiers non testables ou de config)
sonar.coverage.exclusions=\
  src/main.ts, \
  src/environments/**, \
  src/**/*.module.ts, \
  src/**/*.routes.ts, \
  src/app/app.config.ts, \
  src/**/*.mock.ts, \
  src/**/*.stub.ts, \
  src/assets/**

# Rapport de couverture LCOV généré par Karma + karma-coverage
# Chemin : coverage/<nom-app>/lcov.info  (nom-app = "frontend" selon angular.json)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/frontend/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

# --- Temporaire : variantes de boutique soumises a arbitrage (PR [DEPLOY]) ---
# `pages/boutique2` et `pages/boutique3` sont deux autres mises en page de la liste
# et de la fiche produit, servies a cote de `/boutique` le temps de trancher. Elles
# reprennent forcement la structure de l'originale : memes champs de catalogue,
# memes regles d'affichage, meme tunnel — et la troisieme derive de la deuxieme.
# Sonar y voit des lignes dupliquees sur du code neuf, au-dessus du seuil de 3 %,
# et c'est exact : c'est le prix assume de la comparaison.
#
# Seule la detection de duplication est levee, et seulement sur ces dossiers : bugs,
# vulnerabilites, couverture et maintenabilite y restent mesures normalement.
# A supprimer avec les dossiers, une fois l'arbitrage rendu.
sonar.cpd.exclusions=src/app/pages/boutique2/**,src/app/pages/boutique3/**
