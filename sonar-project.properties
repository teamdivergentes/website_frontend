# =====================================================================
# SonarQube - Team Divergentes Frontend
# Instance : https://sonarqube.tellebma.fr/
# =====================================================================

sonar.projectKey=dvg-frontend
sonar.projectName=Team Divergentes - Frontend

# Sources et tests
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.e2e.spec.ts

# Exclusions d'analyse
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/coverage/**, \
  **/*.spec.ts, \
  **/e2e/**, \
  **/playwright-report/**, \
  **/test-results/**, \
  **/.lighthouseci/**

# Exclusions de couverture (fichiers non testables ou de config)
sonar.coverage.exclusions=\
  src/main.ts, \
  src/environments/**, \
  src/**/*.module.ts, \
  src/**/*.routes.ts, \
  src/app/app.config.ts, \
  src/**/*.mock.ts, \
  src/**/*.stub.ts, \
  src/assets/**

# Rapport de couverture LCOV généré par Karma + karma-coverage
# Chemin : coverage/<nom-app>/lcov.info  (nom-app = "frontend" selon angular.json)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/frontend/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

# --- Temporaire : variante de boutique soumise a arbitrage (PR [DEPLOY]) ---
# `pages/boutique2` est une seconde mise en page de la liste et de la fiche produit,
# servie a cote de `/boutique` le temps de trancher. Elle reprend forcement la
# structure de l'originale : memes champs de catalogue, memes regles d'affichage,
# meme tunnel. Sonar y voit 4,3 % de lignes dupliquees sur du code neuf, au-dessus
# du seuil de 3 %, et c'est exact — c'est le prix assume de la comparaison.
#
# Seule la detection de duplication est levee, et seulement sur ce dossier : bugs,
# vulnerabilites, couverture et maintenabilite y restent mesures normalement.
# A supprimer avec le dossier, une fois l'arbitrage rendu.
sonar.cpd.exclusions=src/app/pages/boutique2/**
