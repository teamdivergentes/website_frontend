<footer class="bg-black border-t border-green-dark py-8" role="contentinfo">
  <div class="container mx-auto px-4">
    <!-- Logos section (mobile only) -->
    <div class="flex justify-center items-center gap-8 mb-6 md:hidden">
      <img ngSrc="assets/logos/hashtag.svg" alt="hashtag" width="87" height="35" class="h-8 w-auto">
      <img [ngSrc]="logoFileUrl" alt="logo" width="43" height="42" class="h-10 w-auto">
    </div>

    <!-- Social icons -->
    <div class="flex justify-center space-x-4 mb-6">
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.INSTAGRAM}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.TWITTER}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.YOUTUBE}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.DISCORD}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.TWITCH}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
      <app-icon-link [iconConfig]="{iconType: ProjectIconType.MAIL}"
                     class="border-2 border-white rounded-full p-2 hover:scale-110 transition-transform duration-200"></app-icon-link>
    </div>

    <!-- Copyright -->
    <p class="text-center text-gray-400 text-xs font-secondary">
      Copyright © 2026 TeamDivergentes
    </p>
  </div>
</footer>
