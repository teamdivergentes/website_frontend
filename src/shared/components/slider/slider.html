<section class="slider-container">
  @for (image of images(); track image.index) {
    <picture [ngClass]="{ 'active': currentIndex() === image.index }">
      <!--
        Seules les vues deja demandees portent une source. Le chargement
        paresseux natif ne suffisait pas : les vues sont empilees au meme
        endroit, donc toutes dans la fenetre, et le navigateur les telechargeait
        toutes des le premier rendu. Soit 134 Ko pour deux images que le
        visiteur ne voit qu'apres cinq et dix secondes, en concurrence avec le
        JavaScript du chemin critique.
      -->
      @if (isRequested(image.index)) {
        @if (image.webpPath) {
          <source [srcset]="image.webpPath" type="image/webp">
        }
        <img
          [src]="image.path"
          [width]="image.width"
          [height]="image.height"
          [alt]="image.alt"
          loading="lazy"
        />
      }
    </picture>
  }

  @if (showArrows() && totalSlides() > 1) {
    <div class="slider-container__arrows pointer">
      <svg
        (click)="previousSlide()"
        (keydown.enter)="previousSlide()"
        (keydown.space)="previousSlide()"
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-chevron-left-icon lucide-chevron-left"
        role="button"
        tabindex="0"
        aria-label="Slide précédente"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      <svg
        (click)="nextSlide()"
        (keydown.enter)="nextSlide()"
        (keydown.space)="nextSlide()"
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-chevron-right-icon lucide-chevron-right"
        role="button"
        tabindex="0"
        aria-label="Slide suivante"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </div>
  }

  @if (showDots() && totalSlides() > 1) {
    <div class="slider-container__points">
      @for (image of images(); track image.index) {
        <span
          [ngClass]="{ 'active': currentIndex() === image.index }"
          (click)="goToSlide(image.index)"
          (keydown.enter)="goToSlide(image.index)"
          (keydown.space)="goToSlide(image.index)"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Aller à la slide ' + (image.index + 1)"
        ></span>
      }
    </div>
  }

  @if (autoPlayInterval() > 0 && totalSlides() > 1) {
    <button
      class="slider-container__pause"
      type="button"
      [attr.aria-label]="isPaused() ? 'Reprendre le défilement automatique' : 'Mettre en pause le défilement automatique'"
      (click)="togglePause()">
      @if (isPaused()) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      }
    </button>
  }
</section>
