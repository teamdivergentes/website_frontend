@if (visible()) {
  <!--
    Web:MouseEventWithoutKeyboardEquivalentCheck : la fermeture au clic en dehors du panneau
    (mouse-only) est déportée sur un vrai <button> non focusable (tabindex="-1") et masqué aux
    lecteurs d'écran (aria-hidden="true") plutôt que sur ce <div> role="dialog", car un
    équivalent clavier complet existe déjà : @HostListener('document:keydown.escape') dans le
    composant et le bouton de fermeture visible ci-dessous. Aucune double gestion d'Échap ajoutée.
  -->
  <div
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shop-modal-title"
  >
    <button
      type="button"
      class="modal-backdrop__closer"
      (click)="close()"
      tabindex="-1"
      aria-hidden="true"
    ></button>

    <div class="modal-panel" #modalContainer>

      <!-- Bouton de fermeture -->
      <button
        class="modal-close"
        type="button"
        (click)="close()"
        aria-label="Fermer la fenêtre de détails"
      >
        <span aria-hidden="true">&times;</span>
      </button>

      <!-- Section image -->
      <div class="modal-image-section">
        <div class="main-image">
          <img
            [src]="currentMainImage() || frontImg() || backImg()"
            [alt]="name() + ' - vue principale'"
          />
        </div>
        <div class="thumbnail-strip">
          @if (frontImg()) {
            <button
              class="thumbnail"
              [class.active]="isActiveImage(frontImg())"
              (click)="setMain(frontImg())"
              [attr.aria-pressed]="isActiveImage(frontImg())"
              aria-label="Vue de face"
            >
              <img [src]="frontImg()" [alt]="name() + ' - vue de face'" />
            </button>
          }
          @if (backImg()) {
            <button
              class="thumbnail"
              [class.active]="isActiveImage(backImg())"
              (click)="setMain(backImg())"
              [attr.aria-pressed]="isActiveImage(backImg())"
              aria-label="Vue de dos"
            >
              <img [src]="backImg()" [alt]="name() + ' - vue de dos'" />
            </button>
          }
        </div>
      </div>

      <!-- Section informations -->
      <div class="modal-info-section">
        <div class="info-top">
          <h2 class="product-title" id="shop-modal-title">{{ name() }}</h2>
          <p class="product-price">{{ price() }}€</p>
          <div class="product-description" [innerHTML]="detailsHtml()"></div>
          <div class="separator"></div>
        </div>

        <div class="info-bottom">
          <p class="certification">
            Notre textile et nos encres sont certifiés Oeko-Tex, un label de qualité
            garantissant le contrôle de l'absence de substances nocives dans nos produits.
          </p>
          <div class="made-in-france">
            <div class="flag" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p>Fièrement personnalisé en France</p>
          </div>
          <button
            type="button"
            class="btn-buy"
            (click)="buyRequested.emit()"
            [attr.aria-label]="'Acheter ' + name() + ' pour ' + price() + '€'"
          >
            Acheter
          </button>
        </div>
      </div>

    </div>
  </div>
}
