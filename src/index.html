<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>__OG_TITLE__</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="__OG_DESCRIPTION__">

  <!-- Open Graph meta tags -->
  <meta property="og:title" content="__OG_TITLE__">
  <meta property="og:description" content="__OG_DESCRIPTION__">
  <meta property="og:image" content="__OG_IMAGE__">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="__OG_TITLE__">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Team Divergentes">

  <!-- Twitter Card meta tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="__OG_TITLE__">
  <meta name="twitter:description" content="__OG_DESCRIPTION__">
  <meta name="twitter:image" content="__OG_IMAGE__">

  <!-- Langue alternative (hreflang) -->
  <link rel="alternate" hreflang="fr" href="https://teamdivergentes.fr/">

  <!--
    Favicon suivant le theme du navigateur. Le SVG porte sa propre media query
    `prefers-color-scheme` : un seul fichier sert les deux themes sur Chrome, Edge
    et Firefox. Safari n'accepte aucun favicon SVG, d'ou le repli PNG bascule par
    le script. Detail et recette : `docs/favicon.md`.
  -->
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon-32x32.png" data-favicon>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/favicon-16x16.png" data-favicon>
  <link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png">
  <script>
    // Repli PNG pour Safari. Rien ne s'execute cote serveur : le rendu SSR sert ce
    // script tel quel, seul le navigateur l'evalue. Remplacer le `href` ne suffit
    // pas : Safari ne relit pas un lien d'icone deja traite, il faut un noeud neuf.
    (function () {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function apply() {
        var suffix = mq.matches ? '-dark' : '';
        document.querySelectorAll('link[data-favicon]').forEach(function (link) {
          var next = link.cloneNode();
          next.href = 'assets/logos/favicon-' + link.sizes[0] + suffix + '.png';
          link.parentNode.replaceChild(next, link);
        });
      }
      apply();
      mq.addEventListener('change', apply);
    })();
  </script>

  <!-- Preconnect : miniatures YouTube -->
  <link rel="preconnect" href="https://img.youtube.com">

  <!--
    Polices : auto-hebergees en woff2, declarees dans `styles/_typography.scss`.
    Plus aucun appel a Google Fonts — ni connexion a un domaine tiers avant le
    premier texte, ni transmission de l'IP du visiteur.
    Le site chargeait auparavant Asar, Athiti en sept graisses et Bebas Neue.
  -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/bebas-neue-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/nunito-latin.woff2" crossorigin>

  <!--
    Aucun `preload` d'image ici, et c'est deliberé.

    Ce `head` est partage par TOUTES les routes : un octet preloade est paye sur
    chacune. La ligne qui vivait ici preloadait `slider-1.webp` (69 Ko), la
    premiere vue du carrousel situe SOUS le hero — jamais candidate au LCP, et
    inutile sur les trois autres pages auditees.

    La corriger ne suffit pas : la remplacer par la vraie image LCP de l'accueil
    a bien fait passer `lcp-discovery-insight` au vert (image demandee a 23 ms au
    lieu de 208 ms) mais a DEGRADE le LCP mesure, de 6,0 s a 6,9 s. La raison
    tient a l'architecture : les pages sont rendues par le client, donc l'image ne
    peut pas peindre avant que le chunk de route ne l'ait inseree dans le DOM.
    L'arrivee anticipee des octets ne rapproche pas la peinture — elle prend
    seulement de la bande passante au JavaScript qui, lui, est sur le chemin
    critique. Un preload d'image LCP ne paie que si le HTML porte deja l'element ;
    ce sera le cas le jour ou ces routes seront servies en rendu serveur.
  -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
