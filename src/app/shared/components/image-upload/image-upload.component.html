<div class="image-upload-container">
  <!-- Description contextuelle (optionnelle) -->
  @if (description()) {
    <p class="description">{{ description() }}</p>
  }

  <!-- Zone de drop -->
  <button
    type="button"
    class="drop-zone"
    [disabled]="uploading()"
    [class.dragging]="isDragging()"
    [class.has-image]="displayImage()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()">
    
    <!-- Preview de l'image -->
    @if (displayImage()) {
      <div class="image-preview">
        <img [src]="displayImage()" alt="Preview">
        @if (!uploading()) {
          <button 
            type="button"
            class="remove-btn" 
            (click)="removeImage(); $event.stopPropagation()"
            title="Supprimer l'image">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        }
      </div>
    } @else {
      <!-- Placeholder -->
      <div class="placeholder">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M40 38V10C40 8.89543 39.1046 8 38 8H10C8.89543 8 8 8.89543 8 10V38C8 39.1046 8.89543 40 10 40H38C39.1046 40 40 39.1046 40 38Z" stroke="currentColor" stroke-width="2"/>
          <path d="M8 32L16 24L24 32L32 24L40 32" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>
        <p class="title">Cliquer ou glisser-déposer pour téléverser</p>
        <p class="subtitle">une image ici</p>
      </div>
    }

    <!-- Barre de progression -->
    @if (uploading()) {
      <div class="progress-overlay">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="progress()"></div>
        </div>
        <p class="progress-text">Upload en cours... {{ progress() }}%</p>
      </div>
    }
  </button>

  <!-- Message d'erreur -->
  @if (error()) {
    <div class="error-message">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M8 4V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="12" r="0.5" fill="currentColor"/>
      </svg>
      {{ error() }}
    </div>
  }

  <!-- Texte d'aide (toujours visible) -->
  <p class="helper-text">Formats : JPG, PNG, WebP, GIF, SVG — Max {{ maxSizeMB() }} MB</p>

  <!-- Input file caché. Le libellé est masqué visuellement mais pas des
       technologies d'assistance : le champ reste un contrôle de formulaire, et
       un contrôle sans nom accessible est annoncé « champ ». -->
  <label class="visually-hidden" [for]="inputId">Sélectionner une image</label>
  <input
    #fileInput
    [id]="inputId"
    type="file"
    [accept]="accept()"
    (change)="onFileSelected($event)"
    style="display: none;">
</div>
