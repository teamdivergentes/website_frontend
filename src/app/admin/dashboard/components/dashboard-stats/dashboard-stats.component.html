<div class="welcome-card">
  <h2>Bienvenue, {{ userName() }}</h2>
  <p>Rôle : <strong>{{ userRole() }}</strong></p>
  <div class="quick-links">
    @for (shortcut of quickLinks(); track shortcut.key) {
      <a
        [routerLink]="shortcut.route"
        class="quick-link"
        [attr.data-testid]="'dashboard-stat-' + shortcut.key"
      >
        <mat-icon aria-hidden="true">{{ shortcut.icon }}</mat-icon>
        <span>{{ shortcut.label }}</span>
      </a>
    }
  </div>
</div>
