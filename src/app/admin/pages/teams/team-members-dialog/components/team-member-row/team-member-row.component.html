<div class="drag-handle" cdkDragHandle>
  <mat-icon aria-hidden="true">drag_indicator</mat-icon>
</div>

@if (member().image) {
  <img [src]="member().image" [alt]="member().name" class="member-image" />
} @else {
  <div class="member-image no-image" aria-hidden="true">
    <mat-icon>person</mat-icon>
  </div>
}

<div class="member-info">
  <strong>{{ member().name }}</strong>
  @if (member().realName) {
    <span class="real-name">{{ member().realName }}</span>
  }
  <span class="role">{{ member().role }}</span>
</div>

<div class="member-actions">
  <button mat-icon-button [attr.aria-label]="'Modifier ' + member().name" (click)="onEdit()">
    <mat-icon>edit</mat-icon>
  </button>
  <button mat-icon-button color="warn" [attr.aria-label]="'Supprimer ' + member().name" (click)="onDelete()">
    <mat-icon>delete</mat-icon>
  </button>
</div>
