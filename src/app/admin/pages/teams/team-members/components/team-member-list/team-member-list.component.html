<h3>Membres actuels ({{ members().length }})</h3>

@if (members().length === 0) {
  <app-empty-state message="Aucun membre dans cette équipe" icon="group_off" />
} @else {
  <div cdkDropList (cdkDropListDropped)="onDrop($event)" aria-label="Liste des membres, réordonnable">
    @for (member of members(); track member.id; let i = $index) {
      <div class="member-row-wrapper" cdkDrag>
        <button
          type="button"
          cdkDragHandle
          class="drag-handle"
          [class.grabbed]="grabbedIndex() === i"
          aria-roledescription="element reordonnable"
          [attr.aria-label]="
            'Réordonner ' + member.name + ', position ' + (i + 1) + ' sur ' + members().length
          "
          matTooltip="Glisser ou Espace pour réordonner"
          (keydown)="onHandleKeydown($event, i)"
        >
          <mat-icon aria-hidden="true">drag_indicator</mat-icon>
        </button>
        <app-team-member-row
          [member]="member"
          (editClicked)="onEdit($event)"
          (deleteClicked)="onDelete($event)"
        />
        <div class="reorder-actions">
          <button
            mat-icon-button
            [disabled]="reordering() || i === 0"
            (click)="moveUp(i)"
            [attr.aria-label]="'Deplacer ' + member.name + ' vers le haut'"
            matTooltip="Monter"
          >
            <mat-icon aria-hidden="true">arrow_upward</mat-icon>
          </button>
          <button
            mat-icon-button
            [disabled]="reordering() || i === members().length - 1"
            (click)="moveDown(i)"
            [attr.aria-label]="'Deplacer ' + member.name + ' vers le bas'"
            matTooltip="Descendre"
          >
            <mat-icon aria-hidden="true">arrow_downward</mat-icon>
          </button>
        </div>
      </div>
    }
  </div>
}
