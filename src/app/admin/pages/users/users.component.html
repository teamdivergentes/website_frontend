<div class="users-admin-page">
  <div class="page-header">
    <h1>Gestion des Utilisateurs</h1>
    @if (hasPermission('users:write')) {
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nouvel utilisateur
      </button>
    }
  </div>

  <app-user-filters (filtersChange)="onFiltersChange($event)"></app-user-filters>

  @if (!loading() && totalUsers() > 0) {
    <div class="results-count">
      {{ totalUsers() }} utilisateur{{ totalUsers() > 1 ? 's' : '' }} trouvé{{ totalUsers() > 1 ? 's' : '' }}
    </div>
  }

  <app-user-table
    [users]="users()"
    [loading]="loading()"
    [totalUsers]="totalUsers()"
    [pageSize]="pageSize()"
    [canWrite]="hasPermission('users:write')"
    [canDelete]="hasPermission('users:delete')"
    [canCreate]="hasPermission('users:create')"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (toggleActive)="onToggleActive($event)"
    (actionTriggered)="onTableAction($event)"
    (createClicked)="openCreateDialog()">
  </app-user-table>
</div>
