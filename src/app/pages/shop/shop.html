<section id="shop">
  <!-- Modal de détails réutilisable -->
  <app-shop-item
    [visible]="visible()"
    (closed)="closeDetails()"
    [name]="selectedItem()?.itemName || ''"
    [price]="selectedItem()?.price || ''"
    [adress]="selectedItem()?.adress || ''"
    [frontImg]="selectedItem()?.imgFront || selectedItem()?.img || null"
    [backImg]="selectedItem()?.imgBack || null"
    [detailsHtml]="detailsHtml()">
  </app-shop-item>

  <!-- Section 1 — Hero Banner -->
  <section class="hero-banner">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">BOUTIQUE</h1>
      <p class="hero-subtitle">Équipez-vous aux couleurs de la team</p>
      @if (vipNewItem) {
        <button
          class="hero-cta"
          (click)="openDetails(vipNewItem)"
          type="button">
          Découvrir le maillot
        </button>
      }
    </div>
  </section>

  <!-- Section 2 — Collection 2023 -->
  <section class="collection-section">
    <h2 class="section-title">
      COLLECTION 2023
      <span class="title-underline"></span>
    </h2>

    <div class="products-grid">
      @for (item of allNewItems; track item.id) {
        <article
          class="product-card"
          (click)="onCardClick($event, item)">
          <div class="product-image-wrapper">
            <img
              class="product-image"
              [src]="item.imgFront || item.img"
              [alt]="item.itemName" />
          </div>

          <div class="product-info">
            <h3 class="product-name">{{ item.itemName }}</h3>
            <p class="product-price">{{ item.price }}€</p>

            <div class="product-actions">
              <button
                class="btn btn-details"
                (click)="openDetails(item)"
                type="button">
                Détails
              </button>
              <a
                class="btn btn-buy"
                [href]="item.adress"
                target="_blank"
                rel="noreferrer">
                Acheter
              </a>
            </div>
          </div>
        </article>
      }
    </div>
  </section>

  <!-- Section 3 — Bannière intermédiaire lifestyle -->
  <section class="lifestyle-banner">
    <div class="lifestyle-overlay"></div>
  </section>

  <!-- Section 4 — Collection Classique 2020 -->
  <section class="collection-section">
    <h2 class="section-title">
      COLLECTION CLASSIQUE
      <span class="title-underline"></span>
    </h2>

    <div class="products-grid">
      @for (item of oldItems; track item.id) {
        <article
          class="product-card"
          (click)="onCardClick($event, item)">
          <div class="product-image-wrapper">
            <img
              class="product-image"
              [src]="item.imgFront || item.img"
              [alt]="item.itemName" />
          </div>

          <div class="product-info">
            <h3 class="product-name">{{ item.itemName }}</h3>
            <p class="product-price">{{ item.price }}€</p>

            <div class="product-actions">
              <button
                class="btn btn-details"
                (click)="openDetails(item)"
                type="button">
                Détails
              </button>
              <a
                class="btn btn-buy"
                [href]="item.adress"
                target="_blank"
                rel="noreferrer">
                Acheter
              </a>
            </div>
          </div>
        </article>
      }
    </div>
  </section>

  <!-- Section 5 — Bannière finale -->
  <section class="final-banner">
    <div class="final-overlay"></div>
  </section>
</section>
