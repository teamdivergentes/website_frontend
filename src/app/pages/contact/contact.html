<section id="contact">
  <div class="contact-container">

    <!-- 1. TITRE -->
    <h2 class="title">
      Une demande ? Contactez
      <span>Nous</span>
    </h2>

    <!-- 2. SELECTEUR DESKTOP -->
    <div class="game-selector desktop-only">
      <button
        type="button"
        *ngFor="let game of games"
        [class.active]="selectedGame === game"
        (click)="selectedGame = game">
        {{ game }}
      </button>
    </div>

    <input 
      type="hidden"
      name="selectedGame"
      [(ngModel)]="selectedGame"
      required
      #selectedGameCtrl="ngModel"
    />

    <!-- 3. FORMULAIRE -->
    <form 
      class="contact-form" 
      #contactForm="ngForm" 
      (ngSubmit)="contactForm.valid && onSubmit()"
    >
      <div class="form-fields">

        <!-- SELECTEUR MOBILE -->
        <div class="mobile-select mobile-only">
          <div class="label-wrapper">
            <label for="mobileGame">Choisissez un thème</label>
          </div>

          <select 
            id="mobileGame"
            [(ngModel)]="selectedGame"
            name="mobileGameSelect"
          >
            <option value="" disabled selected>-- Sélectionnez un thème --</option>
            <option *ngFor="let game of games" [value]="game">{{ game }}</option>
          </select>
        </div>

        <!-- MESSAGE D'ERREUR GLOBAL (desktop + mobile) -->
        <div class="error"
          *ngIf="selectedGameCtrl.invalid && contactForm.submitted">
          Veuillez sélectionner l’un des éléments : un jeu, demande de sponsoring ou autre.
        </div>

        <!-- NOM / PRENOM -->
        <div class="label-wrapper">
          <label for="name">Nom / Prénom</label>
        </div>
        <input 
          id="name" 
          name="name" 
          type="text" 
          placeholder="Entrez votre nom/prénom…" 
          required 
          minlength="2"
          [(ngModel)]="name"
          #nameCtrl="ngModel"
        >
        <div class="error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
          Le nom est requis (min. 2 caractères).
        </div>

        <!-- EMAIL -->
        <div class="label-wrapper">
          <label for="email">Adresse e-mail</label>
        </div>
        <input 
          id="email" 
          name="email" 
          type="email" 
          placeholder="Entrez une adresse e-mail valide…"
          required
          email
          [(ngModel)]="email"
          #emailCtrl="ngModel"
        >
        <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
          Veuillez entrer une adresse e-mail valide.
        </div>

        <!-- REQUÊTE -->
        <div class="label-wrapper">
          <label for="request">Requête</label>
        </div>
        <textarea 
          id="request" 
          name="request" 
          placeholder="Adressez votre requête…"
          required
          minlength="10"
          [(ngModel)]="request"
          #requestCtrl="ngModel"
        ></textarea>
        <div class="error" *ngIf="requestCtrl.invalid && requestCtrl.touched">
          La requête doit faire au moins 10 caractères.
        </div>

        <!-- BOUTON -->
        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="contactForm.invalid"
        >
          Envoyer
        </button>

      </div>
    </form>

  </div>
</section>
