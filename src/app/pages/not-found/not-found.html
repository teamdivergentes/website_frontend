<div class="not-found-container">
  <div class="not-found-content">
    <!-- Logo Team Divergent -->
    <div class="logo-section">
      <img src="assets/logos/logoTD.svg" alt="Team Divergent Logo" class="logo">
    </div>

    <!-- Code d'erreur stylisé -->
    <div class="error-code">
      <span class="error-number">4</span>
      <div class="snake-icon">
        <img src="assets/logos/snake.png" alt="Snake" class="snake">
      </div>
      <span class="error-number">4</span>
    </div>

    <!-- Message d'erreur -->
    <div class="error-message">
      <h1>Page introuvable</h1>
      <p>Désolé, la page que vous recherchez n'existe pas ou a été déplacée.</p>
      <p class="suggestion">
        Peut-être cherchiez-vous des informations sur nos équipes esports ou nos derniers matchs ?
      </p>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" (click)="goHome()">
        <mat-icon class="d-flex align-center">home</mat-icon>
        Retour à l'accueil
      </button>
      <button class="btn btn-secondary" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Page précédente
      </button>
    </div>
