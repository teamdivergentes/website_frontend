name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ "main" ]   # build sur main (PREPROD)
    tags: [ "v*" ]         # build sur release tags (PROD) - Format: vXX.YY.ZZ

jobs:
  deploiement:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get workflow run info
        id: workflow-run
        run: |
          echo "head-sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "head-ref=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT

      - name: Determine image tags
        id: tags
        run: |
          chmod +x ./.github/scripts/determine-tags.sh
          ./.github/scripts/determine-tags.sh

      # Déploiement PREPROD (push sur main)
      - name: Deploy image to Coolify PREPROD
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "🚀 Déploiement PREPROD avec l'image: ${{ steps.tags.outputs.workflow-tag }}"
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PREPROD_FRONTEND }}",
            "image": "${{ steps.tags.outputs.workflow-tag }}"
          }'

      # Déploiement PROD (tag vX.Y.Z)
      - name: Deploy image to Coolify PROD
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "🚀 Déploiement PROD avec l'image: ${{ steps.tags.outputs.workflow-tag }}"
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PROD_FRONTEND }}",
            "image": "${{ steps.tags.outputs.workflow-tag }}"
          }'
