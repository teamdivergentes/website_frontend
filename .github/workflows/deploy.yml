name: Deploy sur Coolify

on:
  workflow_run:
    workflows: ["CI Angular Docker"]
    types: [completed]
    branches:
      - main  # Trigger deployment on push to main on PREPROD
      - tags: ['v*'] # Trigger deployment on push to main on PROD

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ne se lance que si la CI s'est terminée avec succès
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        if: secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy image to Coolify PREPROD
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PREPROD_FRONTEND }}",
            "image": "${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
          }'

      - name: Deploy image to Coolify PROD
        if: github.ref == 'refs/tags/v*'
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PROD_FRONTEND }}",
            "image": "${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
          }'
