name: CD

on:
  workflow_run:
    workflows: ["CI Angular Docker"]
    types: [completed]
    branches: [ "main" ]   # build sur main (PREPROD)
    tags: [ "v*" ]         # build sur release tags (PROD)

jobs:
  deploiement:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Déploiement PREPROD (push sur main)
      - name: Deploy image to Coolify PREPROD
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PREPROD_FRONTEND }}",
            "image": "${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
          }'

      # Déploiement PROD (tag vX.Y.Z)
      - name: Deploy image to Coolify PROD
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/apps/deploy" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appId": "${{ secrets.COOLIFY_APPID_PROD_FRONTEND }}",
            "image": "${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
          }'
