name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.build.outputs.build-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Si pas de package-lock ca ne fonctionne pas. # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        id: build
        run: |
          npm run build -- --configuration=production
          echo "build-path=dist/" >> $GITHUB_OUTPUT

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  semgrep:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
          # commentaires sur la PR
          comment-on-pr: true
          # affichage des résultats dans les logs
          publish-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    outputs:
      image-tag: ${{ steps.build-image.outputs.tags }}
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist from build
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/dvg_web_frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=DVG Web Frontend
            org.opencontainers.image.description=Frontend Angular pour DVG
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-report:
    runs-on: ubuntu-latest
    needs: [build, lint, semgrep, docker]
    if: github.event_name == 'pull_request'
    steps:
      - name: Générer le rapport de PR
        id: report
        run: |
          # Collecter les statuts
          BUILD_STATUS="${{ needs.build.result }}"
          LINT_STATUS="${{ needs.lint.result }}"
          SEMGREP_STATUS="${{ needs.semgrep.result }}"
          DOCKER_STATUS="${{ needs.docker.result }}"
          
          # Informations sur l'image Docker
          IMAGE_TAG="${{ needs.docker.outputs.image-tag }}"
          IMAGE_DIGEST="${{ needs.docker.outputs.image-digest }}"
          
          # Déterminer le statut global
          if [[ "$BUILD_STATUS" == "success" && "$LINT_STATUS" == "success" && "$SEMGREP_STATUS" == "success" && "$DOCKER_STATUS" == "success" ]]; then
            OVERALL_STATUS="✅ SUCCÈS"
            STATUS_EMOJI="🎉"
          else
            OVERALL_STATUS="❌ ÉCHEC"
            STATUS_EMOJI="⚠️"
          fi
          
          # Générer le rapport
          cat << EOF > pr_report.md
          ## ${STATUS_EMOJI} Rapport de Build - Frontend Angular
          
          ### 📊 Statut global
          **${OVERALL_STATUS}**
          
          ### 🔧 Détails du build
          | Composant | Statut | Description |
          |-----------|--------|------------|
          | **Build** | ${{ needs.build.result == 'success' && '✅ Succès' || '❌ Échec' }} | Build Angular production |
          | **Linter** | ${{ needs.lint.result == 'success' && '✅ Succès' || '❌ Échec' }} | Vérification qualité de code ESLint |
          | **Sécurité** | ${{ needs.semgrep.result == 'success' && '✅ Succès' || '❌ Échec' }} | Analyse de sécurité Semgrep |
          | **Docker** | ${{ needs.docker.result == 'success' && '✅ Succès' || '❌ Échec' }} | Build de l'image conteneur |
          
          ### 🐳 Image Docker
          **Tag de l'image :** \`${IMAGE_TAG}\`
          
          **Commande pour récupérer l'image :**
          \`\`\`bash
          docker pull ${IMAGE_TAG}
          \`\`\`
          
          **Commande pour lancer l'image :**
          \`\`\`bash
          docker run -d -p 8080:80 --name dvg-frontend ${IMAGE_TAG}
          \`\`\`
          
          **Accès :** http://localhost:8080
          
          ### 📋 Informations sur le build
          - **Commit :** \`${{ github.sha }}\`
          - **Branche :** \`${{ github.head_ref }}\`
          - **Déclenché par :** ${{ github.actor }}
          - **Date du build :** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ### 🔍 Vérifications de qualité
          - **ESLint :** ${{ needs.lint.result == 'success' && 'Toutes les règles de qualité ont été passées' || 'Problèmes de qualité détectés' }}
          - **Semgrep :** ${{ needs.semgrep.result == 'success' && 'Aucune vulnérabilité de sécurité détectée' || 'Problèmes de sécurité détectés' }}
          - **Sécurité Docker :** Image construite avec un utilisateur non-root et en-têtes de sécurité
          
          ### 📚 Documentation
          - [Guide de déploiement](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/frontend/DEPLOYMENT.md)
          - [Configuration Docker](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/frontend/Dockerfile)
          
          ---
          *Ce rapport a été généré automatiquement par le pipeline CI/CD.*
          EOF
          
          echo "report-generated=true" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_report.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Build Report - Frontend Angular')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
