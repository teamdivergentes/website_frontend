name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]  # Format: vXX.YY.ZZ
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.build.outputs.build-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Si pas de package-lock ca ne fonctionne pas. # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        id: build
        run: |
          npm run build -- --configuration=production
          echo "build-path=dist/" >> $GITHUB_OUTPUT

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  semgrep:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
          # commentaires sur la PR
          comment-on-pr: true
          # affichage des résultats dans les logs
          publish-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    outputs:
      image-tag: ${{ steps.tags.outputs.image-tag }}
      workflow-tag: ${{ steps.tags.outputs.workflow-tag }}
      version-tag: ${{ steps.tags.outputs.version-tag }}
      tag-suffix: ${{ steps.tags.outputs.tag-suffix }}
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist from build
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Determine image tags
        id: tags
        run: |
          chmod +x ./.github/scripts/determine-tags.sh
          ./.github/scripts/determine-tags.sh
      
      - name: Update Dockerfile with build labels
        run: |
          chmod +x ./.github/scripts/update-dockerfile-labels.sh
          ./.github/scripts/update-dockerfile-labels.sh \
            "${IMAGE_TAG}" \
            "${WORKFLOW_TAG}" \
            "${TAG_SUFFIX}" \
            "${BUILD_STATUS}" \
            "${LINT_STATUS}" \
            "${SEMGREP_STATUS}" \
            "${GITHUB_SHA}" \
            "${GITHUB_HEAD_REF}" \
            "${GITHUB_ACTOR}" \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            "${GITHUB_REPOSITORY}"

      - name: Update devsecops.yml with build metadata
        run: |
          chmod +x ./.github/scripts/update-devsecops.yml
          ./.github/scripts/update-devsecops.yml \
            "${IMAGE_TAG}" \
            "${WORKFLOW_TAG}" \
            "${TAG_SUFFIX}" \
            "${BUILD_STATUS}" \
            "${LINT_STATUS}" \
            "${SEMGREP_STATUS}" \
            "${GITHUB_SHA}" \
            "${GITHUB_HEAD_REF}" \
            "${GITHUB_ACTOR}" \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            "${GITHUB_REPOSITORY}"
      
      - name: Build and Push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image-tag }}
            ${{ steps.tags.outputs.workflow-tag }}
            ${{ steps.tags.outputs.version-tag }}
          labels: |
            org.opencontainers.image.title=DVG Web Frontend
            org.opencontainers.image.description=Frontend Angular pour DVG
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.workflow=${{ steps.tags.outputs.tag-suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-report:
    runs-on: ubuntu-latest
    needs: [build, lint, semgrep, docker]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      LINT_STATUS: ${{ needs.lint.result }}
      SEMGREP_STATUS: ${{ needs.semgrep.result }}
      DOCKER_STATUS: ${{ needs.docker.result }}
      IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
      WORKFLOW_TAG: ${{ needs.docker.outputs.workflow-tag }}
      VERSION_TAG: ${{ needs.docker.outputs.version-tag }}
      TAG_SUFFIX: ${{ needs.docker.outputs.tag-suffix }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Générer le rapport de PR
        id: report
        run: |
          chmod +x ./.github/scripts/generate-pr-report.sh
          ./.github/scripts/generate-pr-report.sh
          echo "report-generated=true" >> $GITHUB_OUTPUT

      - name: Comment PR
        run: |
          # Exécuter le script de publication (utilise l'API GitHub directement)
          chmod +x ./.github/scripts/publish-pr-comment.js
          node ./.github/scripts/publish-pr-comment.js
