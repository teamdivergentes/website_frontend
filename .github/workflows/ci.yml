name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.build.outputs.build-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Si pas de package-lock ca ne fonctionne pas. # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        id: build
        run: |
          npm run build -- --configuration=production
          echo "build-path=dist/" >> $GITHUB_OUTPUT

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  semgrep:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
          # commentaires sur la PR
          comment-on-pr: true
          # affichage des résultats dans les logs
          publish-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    outputs:
      image-tag: ${{ steps.build-image.outputs.tags }}
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist from build
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/dvg_web_frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=DVG Web Frontend
            org.opencontainers.image.description=Frontend Angular pour DVG
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-report:
    runs-on: ubuntu-latest
    needs: [build, lint, semgrep, docker]
    if: github.event_name == 'pull_request'
    steps:
      - name: Generate PR Report
        id: report
        run: |
          # Collect status information
          BUILD_STATUS="${{ needs.build.result }}"
          LINT_STATUS="${{ needs.lint.result }}"
          SEMGREP_STATUS="${{ needs.semgrep.result }}"
          DOCKER_STATUS="${{ needs.docker.result }}"
          
          # Get image information
          IMAGE_TAG="${{ needs.docker.outputs.image-tag }}"
          IMAGE_DIGEST="${{ needs.docker.outputs.image-digest }}"
          
          # Determine overall status
          if [[ "$BUILD_STATUS" == "success" && "$LINT_STATUS" == "success" && "$SEMGREP_STATUS" == "success" && "$DOCKER_STATUS" == "success" ]]; then
            OVERALL_STATUS="✅ SUCCESS"
            STATUS_EMOJI="🎉"
          else
            OVERALL_STATUS="❌ FAILED"
            STATUS_EMOJI="⚠️"
          fi
          
          # Generate report
          cat << EOF > pr_report.md
          ## ${STATUS_EMOJI} Build Report - Frontend Angular
          
          ### 📊 Overall Status
          **${OVERALL_STATUS}**
          
          ### 🔧 Build Details
          | Component | Status | Details |
          |-----------|--------|---------|
          | **Build** | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} | Angular production build |
          | **Linter** | ${{ needs.lint.result == 'success' && '✅ Success' || '❌ Failed' }} | ESLint code quality check |
          | **Security** | ${{ needs.semgrep.result == 'success' && '✅ Success' || '❌ Failed' }} | Semgrep security analysis |
          | **Docker** | ${{ needs.docker.result == 'success' && '✅ Success' || '❌ Failed' }} | Container image build |
          
          ### 🐳 Docker Image
          **Image Tag:** \`${IMAGE_TAG}\`
          
          **Pull Command:**
          \`\`\`bash
          docker pull ${IMAGE_TAG}
          \`\`\`
          
          **Run Command:**
          \`\`\`bash
          docker run -d -p 8080:80 --name dvg-frontend ${IMAGE_TAG}
          \`\`\`
          
          **Access:** http://localhost:8080
          
          ### 📋 Build Information
          - **Commit:** \`${{ github.sha }}\`
          - **Branch:** \`${{ github.head_ref }}\`
          - **Triggered by:** ${{ github.actor }}
          - **Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ### 🔍 Quality Checks
          - **ESLint:** ${{ needs.lint.result == 'success' && 'All code quality rules passed' || 'Code quality issues detected' }}
          - **Semgrep:** ${{ needs.semgrep.result == 'success' && 'No security vulnerabilities found' || 'Security issues detected' }}
          - **Docker Security:** Image built with non-root user and security headers
          
          ### 📚 Documentation
          - [Deployment Guide](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/frontend/DEPLOYMENT.md)
          - [Docker Configuration](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/frontend/Dockerfile)
          
          ---
          *This report was automatically generated by the CI/CD pipeline.*
          EOF
          
          echo "report-generated=true" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_report.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Build Report - Frontend Angular')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
