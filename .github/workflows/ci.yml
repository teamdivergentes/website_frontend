name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.build.outputs.build-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Si pas de package-lock ca ne fonctionne pas. # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        id: build
        run: |
          npm run build -- --configuration=production
          echo "build-path=dist/" >> $GITHUB_OUTPUT

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  semgrep:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/angular
          auditOn: push
          auditOnPullRequest: true
          commentOnPullRequest: true

  docker:
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist from build
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/dvg_web_frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
